[project]
name = "codepilot"
version = "0.2.0"
description = "A terminal AI coding assistant"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ai", "coding-assistant", "cli", "terminal", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "textual>=2.1.0,<9",
    "anthropic>=0.42.0,<1",
    "openai>=1.60.0,<4",
    "pyyaml>=6.0,<7",
    "pydantic>=2.0,<3",
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0,<1",
    "httpx2>=2.10.0,<3",
    "websockets>=14.0,<18",
]

[project.urls]
Repository = "https://github.com/chenkz666/codepilot-cli"
Issues = "https://github.com/chenkz666/codepilot-cli/issues"

[project.scripts]
codepilot = "codepilot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["codepilot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
